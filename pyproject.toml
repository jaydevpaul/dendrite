[project]
name = "dendrite"
version = "0.1.0"
description = "Graph-aware context composition for branching AI chat."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.4",
    "uuid6>=2024.7.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
