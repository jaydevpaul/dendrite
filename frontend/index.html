<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Dendrite — graph-aware context composition</title>
    <meta
      name="description"
      content="Branch an AI conversation from a highlighted span. The child branch receives context composed at decaying fidelity, not the whole transcript."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap"
    />
    <script>
      // Resolve the theme before first paint so a light-mode user never sees a
      // dark flash (and vice versa). Dark is the default when nothing is stored.
      (function () {
        try {
          var stored = localStorage.getItem("dendrite-theme");
          document.documentElement.dataset.theme = stored === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
